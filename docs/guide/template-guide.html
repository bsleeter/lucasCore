<title>lucasCore User Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* layout: a sticky contents sidebar beside one reading column; on narrow screens the contents fold into a menu above the text */
:root{ {{FONTS}} {{LIGHT}} }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ {{DARK}} color-scheme:dark } }
:root[data-theme="dark"]{ {{DARK}} color-scheme:dark }
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;margin-bottom:18px}
.links a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.links a:hover{color:var(--ink);border-bottom-color:var(--edge)}
.links a[aria-current]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--edge)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
header h1{font:700 28px/1.2 var(--sans);margin:0 0 6px;text-wrap:balance}
header p{margin:0 0 22px;color:var(--muted);max-width:70ch}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;font-size:13px;padding-right:6px}
.side summary{display:none}
.side h2{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc,.toc ol{list-style:none;margin:0;padding:0}
.toc>li{margin:0 0 6px}
.toc>li>a{font-weight:600;color:var(--ink)}
.toc ol{margin:3px 0 0 10px;border-left:1px solid var(--line);padding-left:10px}
.toc a{color:var(--ink2);text-decoration:none;display:block;padding:1px 0}
.toc a:hover,.toc a.here{color:var(--ink)}
.toc a.here{font-weight:600}
main{min-width:0;max-width:78ch}
main h2{font:700 21px/1.3 var(--sans);margin:44px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
main h3{font:600 16.5px/1.35 var(--sans);margin:30px 0 8px}
main h4{font:600 14.5px/1.4 var(--sans);margin:22px 0 6px}
main p,main li{color:var(--ink2)}
main strong{color:var(--ink)}
main a{color:var(--climate)}
main ol,main ul{padding-left:24px}
main li>p{margin:4px 0}
main code{font:400 .88em var(--mono);background:var(--setup-t);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
main pre{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto}
main pre code{background:none;padding:0}
main blockquote{margin:16px 0;padding:6px 16px;border-left:3px solid var(--climate);background:var(--climate-t);border-radius:0 6px 6px 0}
main blockquote p{color:var(--ink)}
main img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin:14px 0 4px}
main p:has(>em:only-child){margin-top:0;font-size:13px;color:var(--muted)}
main figure{margin:16px 0}
main figcaption{font-size:13px;color:var(--muted)}
main table{border-collapse:collapse;width:100%;font-size:13.5px;margin:14px 0;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
main th{background:var(--setup-t);color:var(--ink)}
main td p,main th p{margin:0}
.snapshot{font-size:13px;color:var(--muted)!important;border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:12px}
  .side{position:static;max-height:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
  .side summary{display:block;cursor:pointer;font-weight:600}
  .side h2{display:none}
}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap">
  {{NAV}}
  <header>
    <h1>lucasCore User Guide</h1>
  </header>
  <div class="layout">
    <details class="side" id="side" open>
      <summary>Contents</summary>
      <h2>Contents</h2>
      {{TOC}}
    </details>
    <main id="main">
{{BODY}}
    </main>
  </div>
</div>

<script>
(function () {
  const side = document.getElementById('side');
  const narrow = window.matchMedia('(max-width: 900px)');
  const fit = () => { side.open = !narrow.matches; };
  fit(); narrow.addEventListener('change', fit);
  side.addEventListener('click', e => { if (e.target.closest('.toc a') && narrow.matches) side.open = false; });
  // mark the section being read
  const links = new Map([...side.querySelectorAll('.toc a')].map(a => [a.getAttribute('href').slice(1), a]));
  const heads = [...document.querySelectorAll('main h2[id], main h3[id]')];
  // the last heading above the top quarter of the window, so jumps and fast scrolls land on the right entry
  let current = null;
  function mark() {
    const line = innerHeight * 0.25;
    let h = null;
    for (const x of heads) { if (x.getBoundingClientRect().top <= line) h = x; else break; }
    const a = h ? links.get(h.id) : null;
    if (a === current) return;
    if (current) current.classList.remove('here');
    current = a || null;
    if (current) { current.classList.add('here'); if (!narrow.matches) current.scrollIntoView({ block: 'nearest' }); }
  }
  addEventListener('scroll', mark, { passive: true });
  mark();
})();
</script>
